# Перевірка кожної зміни: усі тести + готовий файл для Cloudflare (functions/api/[[path]].js).
# У pull request файл збирається і комітиться в гілку автоматично; у main — лише перевіряється.
name: Тести

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write # автозлиття (див. останній крок)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Тести
        run: |
          # Помилка тесту — ще й анотацією (видно у підсумку запуску без завантаження журналу).
          fail=0
          for t in tests/*.test.mjs; do
            echo "== $t"
            if ! node --no-warnings "$t" > out.txt 2>&1; then
              fail=1
              cat out.txt
              msg=$(grep -v '^\s*at ' out.txt | tail -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error title=$t::$msg"
            else
              cat out.txt
            fi
          done
          exit $fail
      - name: Збірка
        run: npm run build
      - name: Закомітити зібраний файл (pull request)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- functions/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add functions/
            git commit -m "Збірка functions/api/[[path]].js"
            git push origin HEAD:${{ github.head_ref }}
          fi
      # Автозлиття: PR зливається сам, щойно всі тести пройшли (цей крок іде лише після них) — Cloudflare одразу викладає main.
      # Вмикає власник: Settings → Secrets and variables → Actions → вкладка Variables → New repository variable
      # AUTO_MERGE = true (false або видалити — вимкнути). Лише PR з гілок цього репозиторію, не чернетки;
      # мітка «no-automerge» на PR — цей PR не зливати (залишити на ручну перевірку).
      - name: Автозлиття (якщо ввімкнено)
        if: >-
          github.event_name == 'pull_request' && vars.AUTO_MERGE == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository
          && !github.event.pull_request.draft
          && !contains(github.event.pull_request.labels.*.name, 'no-automerge')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5 # PR має побачити щойно закомічений зібраний файл
          gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --merge --delete-branch
      - name: Готовий файл для Cloudflare оновлено (main)
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- functions/; then
            echo "::error::Після змін у src/ виконайте npm run build і закомітьте functions/api/[[path]].js"
            git diff --stat -- functions/
            exit 1
          fi
